name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: go build ./cmd/nami
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm run build
      - run: go test -tags webui ./...
        working-directory: .
      - run: go build -tags webui -o bin/nami ./cmd/nami
        working-directory: .
